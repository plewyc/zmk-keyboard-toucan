CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# LVGL memory pool - increased for LVGL 9 layer allocations
CONFIG_LV_Z_MEM_POOL_SIZE=32768

# Dedicated thread for display with larger stack
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# System workqueue stack size
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Main stack size for layer allocations
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n